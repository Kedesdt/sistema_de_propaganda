<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Propaganda - Cliente Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/client.css') }}">
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Carregando sistema...</p>
    </div>

    <div id="error-message">
        <h2>⚠️ Erro</h2>
        <p id="error-text"></p>
        <button onclick="retryConnection()">Tentar Novamente</button>
    </div>

    <div id="video-container">
        <video id="video-player" autoplay muted></video>
        <img id="image-player" style="display: none;">
    </div>

    <button class="toggle-config" onclick="toggleConfig()">⚙️ Configurações</button>

    <div id="config-panel" class="hidden">
        <h3>⚙️ Configuração do Cliente</h3>
        <label>Servidor:</label>
        <input type="text" id="server-url" placeholder="http://localhost:5050">
        
        <label>Latitude:</label>
        <input type="number" step="0.000001" id="latitude" placeholder="-23.550520">
        
        <label>Longitude:</label>
        <input type="number" step="0.000001" id="longitude" placeholder="-46.633308">
        
        <label>Intervalo de verificação (segundos):</label>
        <input type="number" id="check-interval" value="60" min="10">
        
        <button onclick="saveConfig()">💾 Salvar e Aplicar</button>
        <button onclick="getLocation()" style="background: #2196F3; margin-top: 5px;">📍 Usar Minha Localização</button>
    </div>

    <div id="info-display">
        <div><strong>📍 Localização:</strong> <span id="location-info">Não configurado</span></div>
        <div><strong>🎥 Vídeo Atual:</strong> <span id="video-info">Nenhum</span></div>
        <div><strong>⏱️ Última verificação:</strong> <span id="last-check">Nunca</span></div>
    </div>

    <div id="status">
        <span id="status-text" class="status-offline">● Offline</span>
    </div>

    <script src="{{ url_for('static', filename='js/client.js') }}"></script>
</body>
</html>
